<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Job Scrapper</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <h1>Job Scrapper</h1>
      <h4>What job do you want?</h4>
      <form
        id="search-form"
        action="./index.html"
      >
        <input
          type="text"
          name="keyword"
          placeholder="Write keyword please"
        />
        <button>Search</button>
      </form>
      <p>이 페이지는 미리 저장한 Wanted 채용 정보를 검색합니다.</p>
      <p
        id="search-message"
        role="status"
      ></p>
      <script>
        const pages = {};
        const message = document.getElementById("search-message");
        message.textContent = Object.keys(pages).length
          ? "지원 검색어: " + Object.keys(pages).join(", ")
          : "아직 저장된 채용 결과가 없습니다.";
        document
          .getElementById("search-form")
          .addEventListener("submit", function (event) {
            event.preventDefault();
            const keyword = this.elements.keyword.value.trim().toLowerCase();
            if (Object.prototype.hasOwnProperty.call(pages, keyword))
              location.href = "./" + pages[keyword];
            else
              message.textContent =
                "이 검색어의 저장된 결과가 없습니다. 실시간 검색은 제공하지 않습니다.";
          });
      </script>
    </main>
  </body>
</html>
