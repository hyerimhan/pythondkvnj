name: Publish GitHub Pages
on:
  push:
    branches: [main, develop]
    paths: ['docs/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          if [ ! -f docs/index.html ]; then
            echo "::error::Missing docs/index.html. Run python build_static.py python javascript java on your computer, then commit and push docs/ before deploying."
            exit 1
          fi
      - name: Publish generated files to gh-pages
        working-directory: docs
        run: |
          test -f index.html
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish static Wanted job snapshots"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
