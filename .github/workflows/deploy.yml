name: Publish GitHub Pages
on:
  push:
    branches: [main, develop]
    paths: ['docs/**', 'data/**', 'templates/**', 'extractors/**', 'main.py', 'build_static.py', 'requirements.txt', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for generated site
        id: site
        run: |
          if [ -f docs/index.html ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.site.outputs.missing == 'true'
        with:
          python-version: '3.12'
      - name: Install build dependencies
        if: steps.site.outputs.missing == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Generate static site when docs is absent
        if: steps.site.outputs.missing == 'true'
        env:
          SCRAPER_HEADLESS: '1'
        run: python build_static.py python javascript java
      - name: Validate static site
        run: |
          if [ ! -f docs/index.html ]; then
            echo "::error::docs/index.html was not generated. Check the static build and Wanted scraping logs."
            exit 1
          fi
      - name: Publish generated files to gh-pages
        working-directory: docs
        run: |
          test -f index.html
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish static Wanted job snapshots"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
